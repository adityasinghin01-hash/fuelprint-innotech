spring.application.name=fuelprint-server
# Every laptop and phone on the stall Wi-Fi reaches the host on port 8080.
server.address=0.0.0.0
server.port=8080

# live (the world loop runs) or replay (fake mode plays classpath:replay/SC*.ndjson).
fp.mode=live
# Stubs are the default until join day; tools/start-real.sh uses the profile "real" (real beans are @Profile("!stub")).
spring.profiles.default=stub

# Folder for the SQLite database and the blob store. A relative path is resolved
# against the repository root (the folder holding contracts/AGREEMENT.md).
fp.data-dir=data/runtime

# Station PINs: server/config/stations.json (never committed). Without it the example file is used on teammates'
# laptops; tools/stall.sh sets fp.stations.allow-example=false.
fp.stations-file=server/config/stations.json
fp.stations.allow-example=true
# Extra web origins allowed to POST and open sockets (comma separated), besides the server's own address.
fp.allowed-origins=

# Fake mode: speed (1 = real timing) and the scenarios played in turn.
fp.replay.speed=1
fp.replay.scenarios=SC1,SC2,SC3
# recorded (default): AutomationBus refuses in fake mode, the recording holds every automatic step. live: it runs.
fp.replay.automation=recorded

# Live socket: events kept for a reconnect with after=, and how far a client may fall behind before it is closed.
fp.live.kept-events=20000
fp.live.max-queued-events=5000

# JSON on the wire is snake_case (AGREEMENT section 3). Nulls are sent, never dropped:
# an unknown value is null plus a reason, not a missing key.
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=always

# Each owner has its own migration number range (V0xx core, V1xx science, ...).
# Branches merge in any order, so allow a lower version to arrive after a higher one.
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=true
